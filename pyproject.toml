[project]
name = "champ-qn-crypto-readiness-scanner"
version = "0.1.0"
description = "CHAMP-QN Crypto Readiness Scanner — a reference post-quantum cryptography readiness assessment tool"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Carnell E. Smith", email = "carnell.smith@champtron-systems.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

dependencies = [
  "fastapi>=0.119,<0.141",
  "starlette>=0.49.1,<2.0",
  "uvicorn[standard]>=0.34,<0.36",
  "pydantic>=2.9,<3.0",
  "PyYAML>=6.0,<7.0",
  "python-multipart>=0.0.18,<0.1",
  "Jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "httpx>=0.27,<0.29",
  "ruff>=0.7,<0.9",
  "black>=26.3.1,<27.0",
  "mypy>=1.11,<1.14",
  "bandit>=1.7,<1.8",
  "pip-audit>=2.7,<3.0",
  "types-PyYAML>=6.0,<7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
