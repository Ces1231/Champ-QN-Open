name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, type-check, security, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Formatting check (black)
        run: black --check .

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Security lint (bandit)
        run: bandit -r app -x tests

      - name: Dependency audit (pip-audit)
        run: pip-audit --strict --skip-editable
        continue-on-error: true # upstream advisories may lag pins; reported, not blocking

      - name: Unit tests
        run: pytest --cov=app --cov-report=term-missing

  docker:
    name: Docker build, health check, SBOM
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t champ-qn-crypto-scanner:ci .

      - name: Start container
        run: docker run -d --name champqn-ci -p 8080:8000 champ-qn-crypto-scanner:ci

      - name: Wait for health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health; then
              echo "Healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy in time"
          docker logs champqn-ci
          exit 1

      - name: Sample assessment smoke test
        run: |
          curl -fsS -X POST http://localhost:8080/api/v1/assess/sample | grep -q overall_score

      - name: Stop container
        if: always()
        run: docker rm -f champqn-ci || true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: champ-qn-crypto-scanner:ci
          format: spdx-json
          output-file: champ-qn-sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: champ-qn-sbom.spdx.json

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: champ-qn-crypto-scanner:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0" # informational: report findings without blocking on upstream base-image CVEs
